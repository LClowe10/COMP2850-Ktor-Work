<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">

        <title>Pico Example</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    </head>

    <body>
        <style>
            h1 {
                --pico-font-family: Pacifico, cursive;
                --pico-font-weight: 400;
                --pico-typography-spacing-vertical: 0.5rem;
            }

            button {
                --pico-font-weight: 700;
            }

        </style>
        <main class="container">
            <h1>My Friends</h1>

            <h2>Vishnu</h2>

            <p>Vishnu is goated at cs</p>
            <h3>What hes good at</h3>
            <ul>
                <li>Coding</li>
                <li>Maths</li>
                <li>Computers</li>
            </ul>

            <h2>Omar</h2>

            <p>Omar uses nano</p>
            <h3>Image of Omar</h3>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRoZzG42bVkQr35exyYlgiTdY_XNlsceikIE6v1EArag&s=10" alt="Omar being an advert">
            <p>Here is the <a href="https://www.instagram.com/reel/DKbYeUIvxEY/" class="contrast"> video </a></p>

             <h2>Tell me about yourself</h2>
            <form action="https://httpbin.io/dump/request" method="POST">
                <fieldset>
                    <legend>Info Form</legend>
                    <p>
                        <label for="un">Enter your name:</label>
                        <input type="text" id="un" name="name">
                    </p>
                    <p>
                        <label for="em">Enter your email:</label>
                        <input type="email" id="em" name="email">
                    </p>
                    <p>
                        <label for="dob">Enter your date of birth:</label>
                        <input type="date" id="dob" name="dob">
                    </p>
                    <p>
                        <label for="colour">Enter your favorite colour:</label>
                        <input type="color" id="colour" name="colour">
                    </p>
                    <p>
                        <label for="staff">Staff</label>
                        <input type="radio" id="staff" name="identity">
                        <br>
                        <label for="student">Student</label>
                        <input type="radio" id="student" name="identity">
                    </p>
                    <button class="outline">submit</button>
                </fieldset>
            </form>

            <a href="index copy.html">Other Website</a>
        </main>
    </body>
</html>
